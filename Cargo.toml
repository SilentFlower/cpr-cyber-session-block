[package]
name = "cpr-cyber-session-block"
version = "0.1.4"
edition = "2024"
rust-version = "1.99.1"
license = "Apache-2.0"
publish = false

[dependencies]
gateway-plugin-sdk = { git = "https://github.com/SilentFlower/codex-proxy-rs.git", rev = "1a2a4a56aed0a9660f173cb1d125b9728e2f214c", features = ["io"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["raw_value"] }
sha2 = "0.10.9"
tokio = { version = "1.52.3", features = ["io-std", "io-util", "macros", "rt", "sync", "time"] }
uuid = { version = "1.23.4", features = ["v4"] }
form_urlencoded = "1.2.2"
time = { version = "0.3.55", default-features = false, features = ["formatting"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = ["process"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
panic = "abort"
